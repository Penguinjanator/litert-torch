# YAML schema for GitHub Actions:
# https://help.github.com/en/actions/automating-your-workflow-with-github-actions/workflow-syntax-for-github-actions
#
# Helpful YAML parser to clarify YAML syntax:
# https://yaml-online-parser.appspot.com/
#
# This workflow will run nightly or when triggered from PR comment

name: Unit Tests Python

on:
  workflow_call:
    inputs:
      trigger-sha:
        type: string
        required: true
      run-on-macos:
        type: boolean
        default: false
jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.set-matrix.outputs.os }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: |
          os=("linux-x86-n4-16")
          if [[ "${{ inputs.run-on-macos }}" == "true" ]]; then
            os+=("macos-latest")
          fi
          os=$(jq -c -n '$ARGS.positional' --args "${os[@]}")
          echo "os=${os}"
          echo "os=${os}" >> $GITHUB_OUTPUT
  test:
    needs: prepare-matrix
    # Keep the default job names unchanged (e.g. "test (3.10, linux-x86-n4-16)")
    # since they are referenced as required checks in copy.bara.sky. Jobs with
    # an extra torch version get a " torch <version>" suffix.
    name: >-
      ${{ matrix.torch == 'default'
          && format('test ({0}, {1})', matrix.python-version, matrix.os)
          || format('test ({0}, {1}, torch {2})', matrix.python-version, matrix.os, matrix.torch) }}
    strategy:
      # Don't let a failure on the extra torch version cancel the default jobs.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: ${{ fromJson(needs.prepare-matrix.outputs.os) }}
        # "default" uses the torch version pinned in requirements.txt.
        torch: ["default"]
        # Also test the previous torch release on the edge Python versions.
        include:
          - python-version: "3.10"
            os: linux-x86-n4-16
            torch: "2.13.0"
            torchvision: "0.28.0"
          - python-version: "3.14"
            os: linux-x86-n4-16
            torch: "2.13.0"
            torchvision: "0.28.0"
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.os == 'linux-x86-n4-16' && 'us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest' || null }}
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ inputs.trigger-sha }}

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - run: |
          python -m pip install --upgrade pip setuptools
          python -m pip cache purge

      - name: Override torch version
        if: matrix.torch != 'default'
        run: |
          sed -i \
            -e "s/^torch==.*/torch==${{ matrix.torch }}/" \
            -e "s/^torchvision==.*/torchvision==${{ matrix.torchvision }}/" \
            requirements.txt
          grep -E "^torch(vision)?==" requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r dev-requirements.txt

      - name: Run Tests
        run: |
          ./run_tests.sh
        env:
          STABLEHLO_BYTECODE_FROM_PRETTYPRINT: 1
          CI: "true"
