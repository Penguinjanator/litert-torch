# Helpful YAML parser to clarify YAML syntax:
# https://yaml-online-parser.appspot.com/

name: Model Coverage (nightly)

on:
  # TODO(weiyiw): The nightly schedule is temporarily disabled while Model
  # Coverage is broken. Uncomment the schedule below to restore it once fixed.
  # schedule:
  #   # 10 am UTC is 3am or 4am PT depending on daylight savings.
  #   - cron: '0 10 * * *'

  workflow_dispatch: {}

jobs:
  run-model-coverage:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.repository == 'google-ai-edge/litert-torch')

    name: Model Coverage (nightly)
    uses: ./.github/workflows/model_coverage.yml
    secrets: inherit
    with:
      trigger-sha: ${{ github.sha }}
